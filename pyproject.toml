[project]
name = "add-line-numbers"
version = "0.1.3"
description = "A lightweight tool that prefixes each line of text files with right-aligned line numbers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Elvez Inc.", email = "info@elvez.co.jp" },
]
maintainers = [
    { name = "Elvez Inc.", email = "info@elvez.co.jp" },
]
keywords = [
    "line-numbers",
    "cli",
    "text",
    "formatting",
    "code-review",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/elvezjp/add-line-numbers"
Repository = "https://github.com/elvezjp/add-line-numbers"
Issues = "https://github.com/elvezjp/add-line-numbers/issues"
Changelog = "https://github.com/elvezjp/add-line-numbers/blob/main/CHANGELOG.md"

[project.scripts]
add-line-numbers = "add_line_numbers:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build>=1.0",
    "twine>=4",
]

[tool.uv]
# Security: raise the floor of the transitive dependency `cryptography`
# (pulled in via twine -> keyring -> SecretStorage on Linux). Versions < 48.0.1
# bundle a vulnerable OpenSSL in their wheels (GHSA-537c-gmf6-5ccf), and
# versions < 50.0.0 expose a Bleichenbacher oracle in PKCS#7 EnvelopedData
# decryption (GHSA-g6cj-pr64-35w5).
# Security: raise the floor of the transitive dependencies `certifi` and `urllib3`.
#   - certifi < 2026.10.18 bundles emSign root CAs whose intermediate CA keys
#     were compromised (GHSA-6q48-6c7w-9gw2)
#   - urllib3 < 2.8.0 buffers an unbounded chunk-size line into memory
#     (GHSA-vxq7-64xx-v4gw) and can loop forever on chunked deflate streams
#     (GHSA-gh4c-6fx4-qh6g)
constraint-dependencies = ["cryptography>=50.0.0", "certifi>=2026.10.18", "urllib3>=2.8.0"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["add_line_numbers.py"]

[tool.hatch.build.targets.sdist]
include = [
    "add_line_numbers.py",
    "README.md",
    "README_ja.md",
    "LICENSE",
    "CHANGELOG.md",
    "test.py",
    "pyproject.toml",
]
